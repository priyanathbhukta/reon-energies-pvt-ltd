name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pos, admin]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: cd apps/${{ matrix.app }} && npm ci

      - name: Run lint
        run: cd apps/${{ matrix.app }} && npm run lint
        continue-on-error: true

      - name: Build
        run: cd apps/${{ matrix.app }} && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.reonenergy.in

  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reon_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install API dependencies
        run: cd server && npm ci

      - name: Run migrations
        run: cd server && node src/scripts/run-migrations.js
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/reon_test

  notify-deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, api-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment notice
        run: |
          echo "✅ All checks passed!"
          echo "🚀 Render (backend) and Vercel (frontend) will auto-deploy from this push."
          echo "   Backend:  https://render.com/dashboard"
          echo "   Frontend: https://vercel.com/dashboard"
