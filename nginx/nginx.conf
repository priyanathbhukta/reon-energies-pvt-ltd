worker_processes auto;

events {
    worker_connections 10000;
    multi_accept on;
}

http {
    # ─── Upstream backends ─────────────────────────────────
    upstream api_backend {
        server api:5000;
    }

    upstream pos_backend {
        server pos:3001;
    }

    upstream admin_backend {
        server admin:3002;
    }

    # ─── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # ─── Security headers ─────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API Server ───────────────────────────────────────
    server {
        listen 80;
        server_name api.reonenergy.in;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400; # WebSocket timeout
        }
    }

    # ─── POS Partner Portal ───────────────────────────────
    server {
        listen 80;
        server_name pos.reonenergy.in;

        location / {
            proxy_pass http://pos_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache static assets
        location /_next/static {
            proxy_pass http://pos_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Admin Dashboard ──────────────────────────────────
    server {
        listen 80;
        server_name admin.reonenergy.in;

        location / {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /_next/static {
            proxy_pass http://admin_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Main Website ─────────────────────────────────────
    server {
        listen 80;
        server_name reonenergy.in www.reonenergy.in;

        # Redirect to main site (currently on Vercel)
        # When migrated to Next.js, add upstream here
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
